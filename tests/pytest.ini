[tool:pytest]
# Pytest configuration for Resume Builder

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -vv
    --strict-markers
    --tb=short
    --durations=10
    --show-capture=all
    --log-cli-level=INFO
    --junit-xml=reports/junit.xml
    --cov-report=html:reports/coverage
    --cov-report=term-missing

# Markers for organizing tests
markers =
    version: Version compatibility tests
    template: Template rendering tests  
    integration: End-to-end integration tests
    slow: Tests that take longer to run
    unit: Fast unit tests
    json: Tests JSON structure requirements
    
# Test filtering
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    
# Coverage options (when using --cov)
[coverage:run]
source = .
omit = 
    tests/*
    .venv/*
    setup.py
    
[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
